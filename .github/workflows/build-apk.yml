name: Build CurTrack APK

on:
  push:
    branches: [main]
    paths-ignore: ["version.json", "**.md", "broker/**", "design/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BUNDLE_BASE64: ${{ secrets.KEYSTORE_BUNDLE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BUNDLE_BASE64" ] || { echo "::error::Secret KEYSTORE_BUNDLE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BUNDLE_BASE64" | tr -d ' \n\r' | base64 -d | tar -xzf -
          mv curtrack-release.jks app/curtrack-release.jks
          echo "keystore bytes: $(wc -c < app/curtrack-release.jks)"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK and compute SHA-256
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/curtrack-${VER}.apk"
          (cd out && sha256sum "curtrack-${VER}.apk" | tee "curtrack-${VER}.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: curtrack-apk
          path: out/
          if-no-files-found: error

      - name: Publish as a GitHub Release (permanent download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          TAG="v${VER}-${CODE}"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/curtrack-${VER}.apk out/curtrack-${VER}.apk.sha256 \
            --title "CurTrack ${VER} (build ${CODE})" \
            --notes "Direct-install build. Open the .apk link on an Android phone to install."

      - name: Write version.json for the in-app updater (always matches the APK just published)
        if: github.ref == 'refs/heads/main'
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          SHA=$(cut -d' ' -f1 out/curtrack-${VER}.apk.sha256)
          NOTES=$(python3 -c 'import json; print(json.load(open("version.json")).get("notes",""))' 2>/dev/null || true)
          python3 - "$VER" "$CODE" "$SHA" "$NOTES" <<'PY'
          import json, sys
          ver, code, sha, notes = sys.argv[1:5]
          json.dump({"versionCode": int(code), "versionName": ver,
                     "url": f"https://github.com/curtrack01/curtrack-android/releases/download/v{ver}-{code}/curtrack-{ver}.apk",
                     "sha256": sha, "notes": notes, "mandatory": False}, open("version.json", "w"), indent=2)
          PY
          git config user.name "CurTrack build" && git config user.email "gps@curtrack.com"
          git add version.json && (git diff --cached --quiet || git commit -m "version.json for ${VER} (build ${CODE}) [skip ci]") && git push
